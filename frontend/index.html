<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Dostt Support</title>
  <link rel="icon" href="/shared/dostt-logo.png" />
  <link rel="stylesheet" href="/shared/tokens.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="chat-shell">
    <header class="chat-header">
      <img src="/shared/dostt-logo.png" alt="" class="brand-mark" aria-hidden="true" />
      <div class="titles">
        <h1>dostt</h1>
        <p class="tagline">AI Assistant · usually replies in seconds</p>
      </div>
      <div class="header-actions">
        <select id="langSelect" aria-label="Language"></select>
        <button class="icon-btn" id="restartBtn" title="Restart" aria-label="Restart conversation">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
        </button>
      </div>
    </header>

    <main class="chat-body" id="chatBody"></main>
    <div class="tickets-body" id="ticketsBody" hidden></div>

    <footer class="composer-footer" id="composerBar">
      <div class="attachment-chip" id="attachmentChip" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
        <span id="attachmentChipName"></span>
        <button type="button" id="attachmentRemoveBtn" aria-label="Remove attachment">&times;</button>
      </div>
      <div class="input-bar">
        <button type="button" class="icon-btn" id="attachBtn" title="Attach a screenshot" aria-label="Attach a screenshot">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
        </button>
        <input type="file" id="attachmentInput" accept="image/jpeg,image/png,image/webp,image/heic" hidden />
        <input type="text" id="freeTextInput" placeholder="Type your message…" autocomplete="off" />
        <button id="sendBtn" aria-label="Send message">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15m0 0-6-6m6 6-6 6"/></svg>
        </button>
      </div>
    </footer>

    <nav class="tab-bar">
      <button class="tab-btn active" id="tabChat" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
        <span>Chat</span>
      </button>
      <button class="tab-btn" id="tabTickets" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v2z"/><line x1="13" y1="5" x2="13" y2="19" stroke-dasharray="2 2"/></svg>
        <span>My Tickets</span>
      </button>
    </nav>
  </div>

  <script src="js/data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
